<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 LA MILANESA - Pedidos Online</title>
    <meta name="description" content="Hacé tu pedido de milanesas, lomitos y empanadas online">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .pulse-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ⚙️ CONFIGURACIÓN - PERSONALIZÁ AQUÍ
        const CONFIG = {
            numeroWhatsApp: '+5493546525687',
            telefonoLlamada: '11 5555-4321',
            nombreLocal: '🔥 LA MILANESA',
            horarios: {
                lunes: { abierto: true, horarios: '11:00-15:00 y 19:00-23:00' },
                martes: { abierto: true, horarios: '11:00-15:00 y 19:00-23:00' },
                miercoles: { abierto: true, horarios: '11:00-15:00 y 19:00-23:00' },
                jueves: { abierto: true, horarios: '11:00-15:00 y 19:00-23:00' },
                viernes: { abierto: true, horarios: '11:00-15:00 y 19:00-00:00' },
                sabado: { abierto: true, horarios: '11:00-00:00' },
                domingo: { abierto: false, horarios: 'Cerrado' },
            },
            redesSociales: {
                instagram: 'https://instagram.com/tulocal',
                facebook: 'https://facebook.com/tulocal',
            },
        };

        // 🍔 MENÚ
        const MENU = {
            sandwiches: [
                { id: 's1', name: 'Milanesa Completa', desc: 'Milanesa, lechuga, tomate, huevo, jamón y queso', price: 3500 },
                { id: 's2', name: 'Milanesa Simple', desc: 'Milanesa con lechuga y tomate', price: 2800 },
                { id: 's3', name: 'Milanesa Napolitana', desc: 'Milanesa con salsa, jamón y muzzarella', price: 3800 },
                { id: 's4', name: 'Milanesa con Fritas', desc: 'Milanesa acompañada de papas fritas', price: 3200 },
            ],
            lomitos: [
                { id: 'l1', name: 'Lomito Completo', desc: 'Lomo, lechuga, tomate, huevo, jamón y queso', price: 4200 },
                { id: 'l2', name: 'Lomito Simple', desc: 'Lomo con lechuga y tomate', price: 3500 },
                { id: 'l3', name: 'Lomito Especial', desc: 'Lomo, panceta, cebolla caramelizada, queso azul', price: 4800 },
            ],
            empanadas: [
                { id: 'e1', name: 'Empanada Carne', desc: 'Carne cortada a cuchillo', price: 600 },
                { id: 'e2', name: 'Empanada J&Q', desc: 'Jamón y queso', price: 600 },
                { id: 'e3', name: 'Empanada Pollo', desc: 'Pollo con verduras', price: 650 },
                { id: 'e4', name: 'Empanada Humita', desc: 'Choclo cremoso', price: 650 },
                { id: 'e5', name: 'Empanada Caprese', desc: 'Tomate, muzzarella y albahaca', price: 650 },
            ],
            bebidas: [
                { id: 'b1', name: 'Coca Cola 500ml', desc: 'Bebida cola', price: 800 },
                { id: 'b2', name: 'Sprite 500ml', desc: 'Bebida lima-limón', price: 800 },
                { id: 'b3', name: 'Agua Mineral', desc: '500ml sin gas', price: 600 },
                { id: 'b4', name: 'Cerveza Quilmes', desc: 'Lata 473ml', price: 1200 },
                { id: 'b5', name: 'Fernet con Coca', desc: 'Preparado 500ml', price: 1500 },
            ],
            postres: [
                { id: 'p1', name: 'Flan con Crema', desc: 'Casero', price: 1200 },
                { id: 'p2', name: 'Helado', desc: '1/4 kg sabor a elección', price: 1500 },
                { id: 'p3', name: 'Brownie', desc: 'Con dulce de leche', price: 1300 },
            ],
        };

        const CATEGORIAS = {
            sandwiches: { nombre: 'Sándwiches de Milanesa', emoji: '🥪' },
            lomitos: { nombre: 'Lomitos', emoji: '🌮' },
            empanadas: { nombre: 'Empanadas', emoji: '🥟' },
            bebidas: { nombre: 'Bebidas', emoji: '🥤' },
            postres: { nombre: 'Postres', emoji: '🍰' },
        };

        // Estado de la app
        let state = {
            carrito: [],
            categoriaActiva: 'sandwiches',
            mostrarCarrito: false,
            delivery: true,
            datosCliente: { nombre: '', telefono: '', direccion: '', notas: '' },
            ubicacion: null,
            metodoPago: 'efectivo',
            pagarCon: '',
            modalProducto: null,
            instruccionesEspeciales: '',
        };

        // Funciones auxiliares
        function calcularTotal() {
            return state.carrito.reduce((sum, item) => sum + (item.price * item.cantidad), 0);
        }

        function totalItems() {
            return state.carrito.reduce((sum, item) => sum + item.cantidad, 0);
        }

        function verificarHorario() {
            const ahora = new Date();
            const diaSemana = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'][ahora.getDay()];
            return CONFIG.horarios[diaSemana].abierto;
        }

        function agregarAlCarrito(producto) {
            state.modalProducto = producto;
            render();
        }

        function confirmarAgregarAlCarrito() {
            const existe = state.carrito.find(item => 
                item.id === state.modalProducto.id && item.instrucciones === state.instruccionesEspeciales
            );
            
            if (existe) {
                state.carrito = state.carrito.map(item =>
                    (item.id === state.modalProducto.id && item.instrucciones === state.instruccionesEspeciales)
                        ? { ...item, cantidad: item.cantidad + 1 }
                        : item
                );
            } else {
                state.carrito.push({ 
                    ...state.modalProducto, 
                    cantidad: 1, 
                    instrucciones: state.instruccionesEspeciales 
                });
            }
            
            state.modalProducto = null;
            state.instruccionesEspeciales = '';
            render();
        }

        function modificarCantidad(index, delta) {
            const item = state.carrito[index];
            item.cantidad += delta;
            if (item.cantidad <= 0) {
                state.carrito.splice(index, 1);
            }
            render();
        }

        function eliminarDelCarrito(index) {
            state.carrito.splice(index, 1);
            render();
        }

        function obtenerUbicacion() {
            if (!navigator.geolocation) {
                alert('Tu navegador no soporta geolocalización');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    state.ubicacion = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    alert('✅ Ubicación guardada correctamente');
                    render();
                },
                () => {
                    alert('No se pudo obtener tu ubicación. Asegurate de dar permisos al navegador.');
                }
            );
        }

        function generarMensajeWhatsApp() {
            let mensaje = `*NUEVO PEDIDO*\n\n`;
            mensaje += `👤 *Cliente:* ${state.datosCliente.nombre}\n`;
            mensaje += `📱 *Teléfono:* ${state.datosCliente.telefono}\n`;
            mensaje += `${state.delivery ? '🛵 *Delivery*' : '📦 *Retiro en local*'}\n`;
            
            if (state.delivery && state.datosCliente.direccion) {
                mensaje += `📍 *Dirección:* ${state.datosCliente.direccion}\n`;
            }
            if (state.delivery && state.ubicacion) {
                mensaje += `🗺️ *Ubicación:* https://www.google.com/maps?q=${state.ubicacion.lat},${state.ubicacion.lng}\n`;
            }
            
            mensaje += `\n💳 *Forma de pago:* ${
                state.metodoPago === 'efectivo' ? 'Efectivo' : 
                state.metodoPago === 'transferencia' ? 'Transferencia' : 'Débito/Crédito'
            }\n`;
            
            if (state.metodoPago === 'efectivo' && state.pagarCon) {
                const vuelto = parseInt(state.pagarCon) - calcularTotal();
                mensaje += `💵 *Paga con:* $${parseInt(state.pagarCon).toLocaleString('es-AR')} (Vuelto: $${vuelto.toLocaleString('es-AR')})\n`;
            }
            
            mensaje += `\n*ITEMS:*\n`;
            state.carrito.forEach(item => {
                mensaje += `\n• ${item.cantidad}x ${item.name} - $${(item.price * item.cantidad).toLocaleString('es-AR')}\n`;
                if (item.desc) mensaje += `  _${item.desc}_\n`;
                if (item.instrucciones) mensaje += `  📝 ${item.instrucciones}\n`;
            });
            
            mensaje += `\n💰 *TOTAL: $${calcularTotal().toLocaleString('es-AR')}*`;
            
            if (state.datosCliente.notas) {
                mensaje += `\n\n📝 *Notas adicionales:* ${state.datosCliente.notas}`;
            }
            
            return encodeURIComponent(mensaje);
        }

        function enviarPedido() {
            if (!state.datosCliente.nombre || !state.datosCliente.telefono) {
                alert('Por favor completá tu nombre y teléfono');
                return;
            }
            if (state.delivery && !state.datosCliente.direccion) {
                alert('Por favor ingresá tu dirección para delivery');
                return;
            }
            if (state.carrito.length === 0) {
                alert('Tu carrito está vacío');
                return;
            }
            if (state.metodoPago === 'efectivo' && state.pagarCon && parseInt(state.pagarCon) < calcularTotal()) {
                alert('El monto con el que pagás debe ser mayor o igual al total');
                return;
            }
            
            const mensaje = generarMensajeWhatsApp();
            window.open(`https://wa.me/${CONFIG.numeroWhatsApp}?text=${mensaje}`, '_blank');
        }

        // Función de renderizado
        function render() {
            const root = document.getElementById('root');
            const estaAbierto = verificarHorario();
            
            root.innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50">
                    <!-- Banner de horarios -->
                    ${!estaAbierto ? `
                        <div class="bg-red-600 text-white py-2 px-4 text-center font-bold text-sm">
                            🔴 CERRADO - Abrimos: ${CONFIG.horarios[['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'][new Date().getDay()]].horarios}
                        </div>
                    ` : `
                        <div class="bg-green-600 text-white py-2 px-4 text-center font-bold flex items-center justify-center gap-2 text-sm">
                            <span class="w-2 h-2 bg-white rounded-full pulse-animation"></span>
                            ABIERTO - ${CONFIG.horarios[['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'][new Date().getDay()]].horarios}
                        </div>
                    `}

                    <!-- Header -->
                    <header class="sticky top-0 z-40 bg-gradient-to-r from-orange-600 to-red-600 text-white shadow-xl">
                        <div class="max-w-6xl mx-auto px-4 py-4">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h1 class="text-2xl font-black tracking-tight">${CONFIG.nombreLocal}</h1>
                                    <p class="text-xs text-orange-100 font-medium">Hacé tu pedido online</p>
                                </div>
                                <div class="flex items-center gap-3">
                                    <button onclick="window.location.href='tel:${CONFIG.telefonoLlamada.replace(/\s/g, '')}'" 
                                            class="bg-white/20 hover:bg-white/30 p-3 rounded-2xl">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                                        </svg>
                                    </button>
                                    <button onclick="state.mostrarCarrito = !state.mostrarCarrito; render()" 
                                            class="relative bg-white/20 hover:bg-white/30 p-3 rounded-2xl">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                                        </svg>
                                        ${totalItems() > 0 ? `
                                            <span class="absolute -top-2 -right-2 bg-yellow-400 text-orange-900 text-xs font-black w-6 h-6 rounded-full flex items-center justify-center">
                                                ${totalItems()}
                                            </span>
                                        ` : ''}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <!-- Categorías -->
                    <div class="sticky top-[${estaAbierto ? '72px' : '104px'}] z-30 bg-white/80 backdrop-blur-md border-b border-orange-200 shadow-sm">
                        <div class="max-w-6xl mx-auto px-4 py-3 overflow-x-auto">
                            <div class="flex gap-2 min-w-max">
                                ${Object.entries(CATEGORIAS).map(([key, cat]) => `
                                    <button onclick="state.categoriaActiva = '${key}'; state.mostrarCarrito = false; render()" 
                                            class="px-4 py-2 rounded-full font-bold text-sm whitespace-nowrap transition-all ${
                                                state.categoriaActiva === key
                                                    ? 'bg-gradient-to-r from-orange-500 to-red-500 text-white shadow-lg scale-105'
                                                    : 'bg-orange-100 text-orange-800 hover:bg-orange-200'
                                            }">
                                        ${cat.emoji} ${cat.nombre}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Modal de instrucciones -->
                    ${state.modalProducto ? `
                        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onclick="state.modalProducto = null; render()">
                            <div class="bg-white rounded-2xl p-6 max-w-md w-full" onclick="event.stopPropagation()">
                                <h3 class="text-xl font-black text-orange-900 mb-2">${state.modalProducto.name}</h3>
                                <p class="text-sm text-gray-600 mb-4">${state.modalProducto.desc}</p>
                                <p class="text-2xl font-black text-orange-600 mb-4">$${state.modalProducto.price.toLocaleString('es-AR')}</p>
                                
                                <label class="block text-sm font-bold text-orange-900 mb-2">Instrucciones especiales (opcional):</label>
                                <textarea id="instruccionesInput" 
                                          placeholder="Ej: Sin cebolla, bien cocido, etc."
                                          class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 focus:border-orange-500 focus:outline-none font-medium resize-none mb-4"
                                          rows="3">${state.instruccionesEspeciales}</textarea>
                                
                                <div class="flex gap-3">
                                    <button onclick="state.modalProducto = null; state.instruccionesEspeciales = ''; render()"
                                            class="flex-1 px-4 py-3 rounded-xl border-2 border-gray-300 font-bold text-gray-700 hover:bg-gray-50">
                                        Cancelar
                                    </button>
                                    <button onclick="state.instruccionesEspeciales = document.getElementById('instruccionesInput').value; confirmarAgregarAlCarrito()"
                                            class="flex-1 bg-gradient-to-r from-orange-500 to-red-500 text-white px-4 py-3 rounded-xl font-bold">
                                        Agregar
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Contenido principal -->
                    <main class="max-w-6xl mx-auto px-4 py-6">
                        ${!state.mostrarCarrito ? `
                            <h2 class="text-3xl font-black text-orange-900 mb-6 flex items-center gap-3">
                                ${CATEGORIAS[state.categoriaActiva].emoji}
                                <span>${CATEGORIAS[state.categoriaActiva].nombre}</span>
                            </h2>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${MENU[state.categoriaActiva].map(producto => `
                                    <div class="bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden group border border-orange-100">
                                        <div class="p-5">
                                            <h3 class="font-black text-lg text-orange-900 mb-1 group-hover:text-orange-600 transition-colors">
                                                ${producto.name}
                                            </h3>
                                            <p class="text-sm text-gray-600 mb-4 line-clamp-2">${producto.desc}</p>
                                            
                                            <div class="flex items-center justify-between">
                                                <span class="text-2xl font-black text-orange-600">
                                                    $${producto.price.toLocaleString('es-AR')}
                                                </span>
                                                <button onclick='agregarAlCarrito(${JSON.stringify(producto)})'
                                                        class="bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 shadow-lg">
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                                    </svg>
                                                    Agregar
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : `
                            <!-- Carrito -->
                            <div class="flex items-center justify-between mb-6">
                                <h2 class="text-3xl font-black text-orange-900">🛒 Tu Pedido</h2>
                                <button onclick="state.mostrarCarrito = false; render()" 
                                        class="text-orange-600 hover:text-orange-800 font-bold">
                                    ← Volver al menú
                                </button>
                            </div>

                            ${state.carrito.length === 0 ? `
                                <div class="bg-white rounded-2xl p-12 text-center shadow-lg">
                                    <svg class="mx-auto mb-4 text-orange-300" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                                    </svg>
                                    <p class="text-xl text-gray-600 font-medium">Tu carrito está vacío</p>
                                    <p class="text-sm text-gray-400 mt-2">Agregá productos del menú</p>
                                </div>
                            ` : `
                                <div class="space-y-6">
                                    <!-- Items -->
                                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                                        ${state.carrito.map((item, index) => `
                                            <div class="border-b border-orange-100 last:border-0 p-4">
                                                <div class="flex items-start justify-between mb-3">
                                                    <div class="flex-1">
                                                        <h3 class="font-bold text-orange-900">${item.name}</h3>
                                                        <p class="text-xs text-gray-500">${item.desc}</p>
                                                        ${item.instrucciones ? `
                                                            <p class="text-xs text-blue-600 font-medium mt-1">📝 ${item.instrucciones}</p>
                                                        ` : ''}
                                                    </div>
                                                    <button onclick="eliminarDelCarrito(${index})" class="text-red-500 hover:text-red-700 p-1">
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                                        </svg>
                                                    </button>
                                                </div>
                                                
                                                <div class="flex items-center justify-between">
                                                    <div class="flex items-center gap-3 bg-orange-50 rounded-xl p-1">
                                                        <button onclick="modificarCantidad(${index}, -1)" 
                                                                class="w-8 h-8 bg-white rounded-lg flex items-center justify-center text-orange-600 font-bold hover:bg-orange-100">
                                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                                <line x1="5" y1="12" x2="19" y2="12"/>
                                                            </svg>
                                                        </button>
                                                        <span class="font-black text-orange-900 w-8 text-center">${item.cantidad}</span>
                                                        <button onclick="modificarCantidad(${index}, 1)" 
                                                                class="w-8 h-8 bg-white rounded-lg flex items-center justify-center text-orange-600 font-bold hover:bg-orange-100">
                                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                    <span class="text-lg font-black text-orange-600">
                                                        $${(item.price * item.cantidad).toLocaleString('es-AR')}
                                                    </span>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <!-- Delivery/Retiro -->
                                    <div class="bg-white rounded-2xl shadow-lg p-6">
                                        <h3 class="font-black text-orange-900 mb-4">Forma de entrega</h3>
                                        <div class="grid grid-cols-2 gap-3">
                                            <button onclick="state.delivery = true; render()" 
                                                    class="p-4 rounded-xl border-2 font-bold ${
                                                        state.delivery ? 'border-orange-500 bg-orange-50 text-orange-700' : 'border-gray-200 text-gray-600'
                                                    }">
                                                📍 Delivery
                                            </button>
                                            <button onclick="state.delivery = false; render()" 
                                                    class="p-4 rounded-xl border-2 font-bold ${
                                                        !state.delivery ? 'border-orange-500 bg-orange-50 text-orange-700' : 'border-gray-200 text-gray-600'
                                                    }">
                                                📦 Retiro
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Datos del cliente -->
                                    <div class="bg-white rounded-2xl shadow-lg p-6">
                                        <h3 class="font-black text-orange-900 mb-4">Tus datos</h3>
                                        <div class="space-y-3">
                                            <input type="text" placeholder="Tu nombre *" id="inputNombre" value="${state.datosCliente.nombre}"
                                                   onchange="state.datosCliente.nombre = this.value"
                                                   class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 focus:border-orange-500 focus:outline-none font-medium">
                                            <input type="tel" placeholder="Tu teléfono *" id="inputTelefono" value="${state.datosCliente.telefono}"
                                                   onchange="state.datosCliente.telefono = this.value"
                                                   class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 focus:border-orange-500 focus:outline-none font-medium">
                                            ${state.delivery ? `
                                                <input type="text" placeholder="Tu dirección *" id="inputDireccion" value="${state.datosCliente.direccion}"
                                                       onchange="state.datosCliente.direccion = this.value"
                                                       class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 focus:border-orange-500 focus:outline-none font-medium">
                                                <button onclick="obtenerUbicacion()" 
                                                        class="w-full px-4 py-3 rounded-xl border-2 font-bold flex items-center justify-center gap-2 ${
                                                            state.ubicacion ? 'border-green-500 bg-green-50 text-green-700' : 'border-orange-500 bg-orange-50 text-orange-700'
                                                        }">
                                                    📍 ${state.ubicacion ? '✓ Ubicación compartida' : 'Compartir mi ubicación'}
                                                </button>
                                                ${state.ubicacion ? '<p class="text-xs text-green-600 font-medium text-center">Tu ubicación se enviará en el pedido</p>' : ''}
                                            ` : ''}
                                            <textarea placeholder="Notas adicionales (opcional)" id="inputNotas"
                                                      onchange="state.datosCliente.notas = this.value"
                                                      class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 focus:border-orange-500 focus:outline-none font-medium resize-none"
                                                      rows="3">${state.datosCliente.notas}</textarea>
                                        </div>
                                    </div>

                                    <!-- Método de pago -->
                                    <div class="bg-white rounded-2xl shadow-lg p-6">
                                        <h3 class="font-black text-orange-900 mb-4">Método de pago</h3>
                                        <div class="space-y-3">
                                            <button onclick="state.metodoPago = 'efectivo'; render()" 
                                                    class="w-full p-4 rounded-xl border-2 font-bold text-left ${
                                                        state.metodoPago === 'efectivo' ? 'border-orange-500 bg-orange-50 text-orange-700' : 'border-gray-200 text-gray-600'
                                                    }">
                                                💵 Efectivo
                                            </button>
                                            ${state.metodoPago === 'efectivo' ? `
                                                <input type="number" placeholder="¿Con cuánto pagás? (opcional)" id="inputPagarCon" value="${state.pagarCon}"
                                                       onchange="state.pagarCon = this.value"
                                                       class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 focus:border-orange-500 focus:outline-none font-medium">
                                            ` : ''}
                                            <button onclick="state.metodoPago = 'transferencia'; render()" 
                                                    class="w-full p-4 rounded-xl border-2 font-bold text-left ${
                                                        state.metodoPago === 'transferencia' ? 'border-orange-500 bg-orange-50 text-orange-700' : 'border-gray-200 text-gray-600'
                                                    }">
                                                🏦 Transferencia
                                            </button>
                                            <button onclick="state.metodoPago = 'tarjeta'; render()" 
                                                    class="w-full p-4 rounded-xl border-2 font-bold text-left ${
                                                        state.metodoPago === 'tarjeta' ? 'border-orange-500 bg-orange-50 text-orange-700' : 'border-gray-200 text-gray-600'
                                                    }">
                                                💳 Débito / Crédito
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Total y enviar -->
                                    <div class="bg-gradient-to-r from-orange-600 to-red-600 rounded-2xl shadow-2xl p-6 text-white">
                                        <div class="flex items-center justify-between mb-4">
                                            <span class="text-xl font-bold">TOTAL</span>
                                            <span class="text-4xl font-black">$${calcularTotal().toLocaleString('es-AR')}</span>
                                        </div>
                                        <button onclick="enviarPedido()" 
                                                class="w-full bg-white text-orange-600 py-4 rounded-xl font-black text-lg hover:bg-orange-50">
                                            📲 ENVIAR PEDIDO POR WHATSAPP
                                        </button>
                                    </div>
                                </div>
                            `}
                        `}
                    </main>

                    <!-- Footer -->
                    <footer class="mt-12 py-8 bg-white border-t border-orange-200">
                        <div class="max-w-6xl mx-auto px-4 text-center">
                            <p class="font-bold text-orange-900 mb-4">${CONFIG.nombreLocal}</p>
                            
                            <div class="flex justify-center gap-4 mb-4">
                                ${CONFIG.redesSociales.instagram ? `
                                    <a href="${CONFIG.redesSociales.instagram}" target="_blank" rel="noopener noreferrer"
                                       class="w-10 h-10 bg-gradient-to-br from-purple-600 to-pink-500 text-white rounded-full flex items-center justify-center">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                                        </svg>
                                    </a>
                                ` : ''}
                                ${CONFIG.redesSociales.facebook ? `
                                    <a href="${CONFIG.redesSociales.facebook}" target="_blank" rel="noopener noreferrer"
                                       class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                                        </svg>
                                    </a>
                                ` : ''}
                            </div>
                            
                            <div class="text-sm text-gray-600">
                                <p class="font-bold mb-2">Horarios de atención:</p>
                                ${Object.entries(CONFIG.horarios).map(([dia, info]) => `
                                    <p class="text-xs"><span class="capitalize font-medium">${dia}</span>: ${info.horarios}</p>
                                `).join('')}
                            </div>
                            
                            <p class="text-xs text-gray-400 mt-4">Pedidos Online</p>
                        </div>
                    </footer>
                </div>
            `;
        }

        // Iniciar la app
        render();
    </script>
</body>
</html>
