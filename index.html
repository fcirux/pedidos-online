<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 LA MILANESA - Pedidos Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .pulse-animation { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const CONFIG = {
            numeroWhatsApp: '5491123456789',
            telefonoLlamada: '11 5555-4321',
            nombreLocal: '🔥 LA MILANESA',
            horarios: {
                lunes: { abierto: true, horarios: '11:00-15:00 y 19:00-23:00' },
                martes: { abierto: true, horarios: '11:00-15:00 y 19:00-23:00' },
                miercoles: { abierto: true, horarios: '11:00-15:00 y 19:00-23:00' },
                jueves: { abierto: true, horarios: '11:00-15:00 y 19:00-23:00' },
                viernes: { abierto: true, horarios: '11:00-15:00 y 19:00-00:00' },
                sabado: { abierto: true, horarios: '11:00-00:00' },
                domingo: { abierto: false, horarios: 'Cerrado' },
            },
            redesSociales: {
                instagram: 'https://instagram.com/tulocal',
                facebook: 'https://facebook.com/tulocal',
            },
        };
        const MENU = {
            sandwiches: [
                { id: 's1', name: 'Milanesa Completa', desc: 'Milanesa, lechuga, tomate, huevo, jamón y queso', price: 3500 },
                { id: 's2', name: 'Milanesa Simple', desc: 'Milanesa con lechuga y tomate', price: 2800 },
                { id: 's3', name: 'Milanesa Napolitana', desc: 'Milanesa con salsa, jamón y muzzarella', price: 3800 },
            ],
            lomitos: [
                { id: 'l1', name: 'Lomito Completo', desc: 'Lomo, lechuga, tomate, huevo, jamón y queso', price: 4200 },
                { id: 'l2', name: 'Lomito Simple', desc: 'Lomo con lechuga y tomate', price: 3500 },
            ],
            empanadas: [
                { id: 'e1', name: 'Empanada Carne', desc: 'Carne cortada a cuchillo', price: 600 },
                { id: 'e2', name: 'Empanada J&Q', desc: 'Jamón y queso', price: 600 },
                { id: 'e3', name: 'Empanada Pollo', desc: 'Pollo con verduras', price: 650 },
            ],
            bebidas: [
                { id: 'b1', name: 'Coca Cola 500ml', desc: 'Bebida cola', price: 800 },
                { id: 'b2', name: 'Sprite 500ml', desc: 'Bebida lima-limón', price: 800 },
            ],
            postres: [
                { id: 'p1', name: 'Flan con Crema', desc: 'Casero', price: 1200 },
                { id: 'p2', name: 'Helado', desc: '1/4 kg sabor a elección', price: 1500 },
            ],
        };
        const CATEGORIAS = {
            sandwiches: { nombre: 'Sándwiches', emoji: '🥪' },
            lomitos: { nombre: 'Lomitos', emoji: '🌮' },
            empanadas: { nombre: 'Empanadas', emoji: '🥟' },
            bebidas: { nombre: 'Bebidas', emoji: '🥤' },
            postres: { nombre: 'Postres', emoji: '🍰' },
        };
        let state = {
            carrito: [],
            categoriaActiva: 'sandwiches',
            mostrarCarrito: false,
            delivery: true,
            datosCliente: { nombre: '', telefono: '', direccion: '', notas: '' },
            ubicacion: null,
            metodoPago: 'efectivo',
            pagarCon: '',
            modalProducto: null,
            instruccionesEspeciales: '',
        };
        function calcularTotal() { return state.carrito.reduce((s, i) => s + (i.price * i.cantidad), 0); }
        function totalItems() { return state.carrito.reduce((s, i) => s + i.cantidad, 0); }
        function verificarHorario() {
            const d = new Date();
            const dia = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'][d.getDay()];
            return CONFIG.horarios[dia].abierto;
        }
        function agregarAlCarrito(p) { state.modalProducto = p; render(); }
        function confirmarAgregarAlCarrito() {
            const existe = state.carrito.find(i => i.id === state.modalProducto.id && i.instrucciones === state.instruccionesEspeciales);
            if (existe) {
                state.carrito = state.carrito.map(i => (i.id === state.modalProducto.id && i.instrucciones === state.instruccionesEspeciales) ? {...i, cantidad: i.cantidad+1} : i);
            } else {
                state.carrito.push({...state.modalProducto, cantidad: 1, instrucciones: state.instruccionesEspeciales});
            }
            state.modalProducto = null;
            state.instruccionesEspeciales = '';
            render();
        }
        function modificarCantidad(idx, delta) {
            state.carrito[idx].cantidad += delta;
            if (state.carrito[idx].cantidad <= 0) state.carrito.splice(idx, 1);
            render();
        }
        function eliminarDelCarrito(idx) { state.carrito.splice(idx, 1); render(); }
        function obtenerUbicacion() {
            if (!navigator.geolocation) { alert('Tu navegador no soporta geolocalización'); return; }
            navigator.geolocation.getCurrentPosition(
                (p) => { state.ubicacion = {lat: p.coords.latitude, lng: p.coords.longitude}; alert('✅ Ubicación guardada'); render(); },
                () => alert('No se pudo obtener tu ubicación')
            );
        }
        function generarMensajeWhatsApp() {
            let m = `*NUEVO PEDIDO*\n\n👤 *Cliente:* ${state.datosCliente.nombre}\n📱 *Teléfono:* ${state.datosCliente.telefono}\n`;
            m += `${state.delivery ? '🛵 *Delivery*' : '📦 *Retiro en local*'}\n`;
            if (state.delivery && state.datosCliente.direccion) m += `📍 *Dirección:* ${state.datosCliente.direccion}\n`;
            if (state.delivery && state.ubicacion) m += `🗺️ *Ubicación:* https://www.google.com/maps?q=${state.ubicacion.lat},${state.ubicacion.lng}\n`;
            m += `\n💳 *Forma de pago:* ${state.metodoPago === 'efectivo' ? 'Efectivo' : state.metodoPago === 'transferencia' ? 'Transferencia' : 'Débito/Crédito'}\n`;
            if (state.metodoPago === 'efectivo' && state.pagarCon) {
                const v = parseInt(state.pagarCon) - calcularTotal();
                m += `💵 *Paga con:* $${parseInt(state.pagarCon).toLocaleString('es-AR')} (Vuelto: $${v.toLocaleString('es-AR')})\n`;
            }
            m += `\n*ITEMS:*\n`;
            state.carrito.forEach(i => {
                m += `\n• ${i.cantidad}x ${i.name} - $${(i.price * i.cantidad).toLocaleString('es-AR')}\n`;
                if (i.desc) m += `  _${i.desc}_\n`;
                if (i.instrucciones) m += `  📝 ${i.instrucciones}\n`;
            });
            m += `\n💰 *TOTAL: $${calcularTotal().toLocaleString('es-AR')}*`;
            if (state.datosCliente.notas) m += `\n\n📝 *Notas adicionales:* ${state.datosCliente.notas}`;
            return encodeURIComponent(m);
        }
        function enviarPedido() {
            if (!state.datosCliente.nombre || !state.datosCliente.telefono) { alert('Completá nombre y teléfono'); return; }
            if (state.delivery && !state.datosCliente.direccion) { alert('Ingresá tu dirección'); return; }
            if (state.carrito.length === 0) { alert('Tu carrito está vacío'); return; }
            if (state.metodoPago === 'efectivo' && state.pagarCon && parseInt(state.pagarCon) < calcularTotal()) { alert('El monto debe ser mayor o igual al total'); return; }
            window.open(`https://wa.me/${CONFIG.numeroWhatsApp}?text=${generarMensajeWhatsApp()}`, '_blank');
        }
        function render() {
            const root = document.getElementById('root');
            const ea = verificarHorario();
            const dia = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'][new Date().getDay()];
            root.innerHTML = `<div class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50">
                ${!ea ? `<div class="bg-red-600 text-white py-2 px-4 text-center font-bold text-sm">🔴 CERRADO - Abrimos: ${CONFIG.horarios[dia].horarios}</div>` 
                      : `<div class="bg-green-600 text-white py-2 px-4 text-center font-bold text-sm flex items-center justify-center gap-2"><span class="w-2 h-2 bg-white rounded-full pulse-animation"></span>ABIERTO - ${CONFIG.horarios[dia].horarios}</div>`}
                <header class="sticky top-0 z-40 bg-gradient-to-r from-orange-600 to-red-600 text-white shadow-xl">
                    <div class="max-w-6xl mx-auto px-4 py-4">
                        <div class="flex items-center justify-between">
                            <div><h1 class="text-2xl font-black">${CONFIG.nombreLocal}</h1><p class="text-xs text-orange-100">Hacé tu pedido online</p></div>
                            <div class="flex gap-3">
                                <button onclick="window.location.href='tel:${CONFIG.telefonoLlamada.replace(/\s/g,'')}'" class="bg-white/20 p-3 rounded-2xl">☎️</button>
                                <button onclick="state.mostrarCarrito=!state.mostrarCarrito;render()" class="relative bg-white/20 p-3 rounded-2xl">
                                    🛒${totalItems()>0?`<span class="absolute -top-2 -right-2 bg-yellow-400 text-orange-900 text-xs font-black w-6 h-6 rounded-full flex items-center justify-center">${totalItems()}</span>`:''}
                                </button>
                            </div>
                        </div>
                    </div>
                </header>
                <div class="sticky ${ea?'top-[72px]':'top-[104px]'} z-30 bg-white/80 backdrop-blur-md border-b border-orange-200">
                    <div class="max-w-6xl mx-auto px-4 py-3 overflow-x-auto">
                        <div class="flex gap-2 min-w-max">
                            ${Object.entries(CATEGORIAS).map(([k,c])=>`<button onclick="state.categoriaActiva='${k}';state.mostrarCarrito=false;render()" class="px-4 py-2 rounded-full font-bold text-sm whitespace-nowrap ${state.categoriaActiva===k?'bg-gradient-to-r from-orange-500 to-red-500 text-white shadow-lg':'bg-orange-100 text-orange-800'}">${c.emoji} ${c.nombre}</button>`).join('')}
                        </div>
                    </div>
                </div>
                ${state.modalProducto?`<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onclick="state.modalProducto=null;render()">
                    <div class="bg-white rounded-2xl p-6 max-w-md w-full" onclick="event.stopPropagation()">
                        <h3 class="text-xl font-black text-orange-900 mb-2">${state.modalProducto.name}</h3>
                        <p class="text-sm text-gray-600 mb-4">${state.modalProducto.desc}</p>
                        <p class="text-2xl font-black text-orange-600 mb-4">$${state.modalProducto.price.toLocaleString('es-AR')}</p>
                        <label class="block text-sm font-bold text-orange-900 mb-2">Instrucciones (opcional):</label>
                        <textarea id="instruccionesInput" placeholder="Sin cebolla, bien cocido..." class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 resize-none mb-4" rows="3">${state.instruccionesEspeciales}</textarea>
                        <div class="flex gap-3">
                            <button onclick="state.modalProducto=null;state.instruccionesEspeciales='';render()" class="flex-1 px-4 py-3 rounded-xl border-2 border-gray-300 font-bold">Cancelar</button>
                            <button onclick="state.instruccionesEspeciales=document.getElementById('instruccionesInput').value;confirmarAgregarAlCarrito()" class="flex-1 bg-gradient-to-r from-orange-500 to-red-500 text-white px-4 py-3 rounded-xl font-bold">Agregar</button>
                        </div>
                    </div>
                </div>`:''}
                <main class="max-w-6xl mx-auto px-4 py-6">
                    ${!state.mostrarCarrito?`<h2 class="text-3xl font-black text-orange-900 mb-6">${CATEGORIAS[state.categoriaActiva].emoji} ${CATEGORIAS[state.categoriaActiva].nombre}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${MENU[state.categoriaActiva].map(p=>`<div class="bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all p-5 border border-orange-100">
                            <h3 class="font-black text-lg text-orange-900 mb-1">${p.name}</h3>
                            <p class="text-sm text-gray-600 mb-4">${p.desc}</p>
                            <div class="flex items-center justify-between">
                                <span class="text-2xl font-black text-orange-600">$${p.price.toLocaleString('es-AR')}</span>
                                <button onclick='agregarAlCarrito(${JSON.stringify(p)})' class="bg-gradient-to-r from-orange-500 to-red-500 text-white px-5 py-2.5 rounded-xl font-bold">+ Agregar</button>
                            </div>
                        </div>`).join('')}
                    </div>`:`<div class="flex items-center justify-between mb-6">
                        <h2 class="text-3xl font-black text-orange-900">🛒 Tu Pedido</h2>
                        <button onclick="state.mostrarCarrito=false;render()" class="text-orange-600 font-bold">← Volver</button>
                    </div>
                    ${state.carrito.length===0?`<div class="bg-white rounded-2xl p-12 text-center shadow-lg"><p class="text-xl text-gray-600 font-medium">Tu carrito está vacío</p></div>`:`<div class="space-y-6">
                        <div class="bg-white rounded-2xl shadow-lg">
                            ${state.carrito.map((i,idx)=>`<div class="border-b last:border-0 p-4">
                                <div class="flex justify-between mb-3">
                                    <div class="flex-1"><h3 class="font-bold text-orange-900">${i.name}</h3><p class="text-xs text-gray-500">${i.desc}</p>${i.instrucciones?`<p class="text-xs text-blue-600 mt-1">📝 ${i.instrucciones}</p>`:''}</div>
                                    <button onclick="eliminarDelCarrito(${idx})" class="text-red-500 p-1">🗑️</button>
                                </div>
                                <div class="flex justify-between">
                                    <div class="flex gap-3 bg-orange-50 rounded-xl p-1">
                                        <button onclick="modificarCantidad(${idx},-1)" class="w-8 h-8 bg-white rounded-lg text-orange-600 font-bold">-</button>
                                        <span class="font-black text-orange-900 w-8 text-center">${i.cantidad}</span>
                                        <button onclick="modificarCantidad(${idx},1)" class="w-8 h-8 bg-white rounded-lg text-orange-600 font-bold">+</button>
                                    </div>
                                    <span class="text-lg font-black text-orange-600">$${(i.price*i.cantidad).toLocaleString('es-AR')}</span>
                                </div>
                            </div>`).join('')}
                        </div>
                        <div class="bg-white rounded-2xl shadow-lg p-6">
                            <h3 class="font-black text-orange-900 mb-4">Forma de entrega</h3>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="state.delivery=true;render()" class="p-4 rounded-xl border-2 font-bold ${state.delivery?'border-orange-500 bg-orange-50 text-orange-700':'border-gray-200'}">📍 Delivery</button>
                                <button onclick="state.delivery=false;render()" class="p-4 rounded-xl border-2 font-bold ${!state.delivery?'border-orange-500 bg-orange-50 text-orange-700':'border-gray-200'}">📦 Retiro</button>
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-lg p-6">
                            <h3 class="font-black text-orange-900 mb-4">Tus datos</h3>
                            <div class="space-y-3">
                                <input type="text" placeholder="Tu nombre *" value="${state.datosCliente.nombre}" onchange="state.datosCliente.nombre=this.value" class="w-full px-4 py-3 rounded-xl border-2 border-orange-200">
                                <input type="tel" placeholder="Tu teléfono *" value="${state.datosCliente.telefono}" onchange="state.datosCliente.telefono=this.value" class="w-full px-4 py-3 rounded-xl border-2 border-orange-200">
                                ${state.delivery?`<input type="text" placeholder="Tu dirección *" value="${state.datosCliente.direccion}" onchange="state.datosCliente.direccion=this.value" class="w-full px-4 py-3 rounded-xl border-2 border-orange-200">
                                <button onclick="obtenerUbicacion()" class="w-full px-4 py-3 rounded-xl border-2 font-bold ${state.ubicacion?'border-green-500 bg-green-50 text-green-700':'border-orange-500 bg-orange-50 text-orange-700'}">📍 ${state.ubicacion?'✓ Ubicación compartida':'Compartir ubicación'}</button>`:''}
                                <textarea placeholder="Notas (opcional)" onchange="state.datosCliente.notas=this.value" class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 resize-none" rows="3">${state.datosCliente.notas}</textarea>
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-lg p-6">
                            <h3 class="font-black text-orange-900 mb-4">Método de pago</h3>
                            <div class="space-y-3">
                                <button onclick="state.metodoPago='efectivo';render()" class="w-full p-4 rounded-xl border-2 font-bold text-left ${state.metodoPago==='efectivo'?'border-orange-500 bg-orange-50 text-orange-700':'border-gray-200'}">💵 Efectivo</button>
                                ${state.metodoPago==='efectivo'?`<input type="number" placeholder="¿Con cuánto pagás?" value="${state.pagarCon}" onchange="state.pagarCon=this.value" class="w-full px-4 py-3 rounded-xl border-2 border-orange-200">`:''}
                                <button onclick="state.metodoPago='transferencia';render()" class="w-full p-4 rounded-xl border-2 font-bold text-left ${state.metodoPago==='transferencia'?'border-orange-500 bg-orange-50 text-orange-700':'border-gray-200'}">🏦 Transferencia</button>
                                <button onclick="state.metodoPago='tarjeta';render()" class="w-full p-4 rounded-xl border-2 font-bold text-left ${state.metodoPago==='tarjeta'?'border-orange-500 bg-orange-50 text-orange-700':'border-gray-200'}">💳 Débito/Crédito</button>
                            </div>
                        </div>
                        <div class="bg-gradient-to-r from-orange-600 to-red-600 rounded-2xl p-6 text-white">
                            <div class="flex justify-between mb-4">
                                <span class="text-xl font-bold">TOTAL</span>
                                <span class="text-4xl font-black">$${calcularTotal().toLocaleString('es-AR')}</span>
                            </div>
                            <button onclick="enviarPedido()" class="w-full bg-white text-orange-600 py-4 rounded-xl font-black text-lg">📲 ENVIAR POR WHATSAPP</button>
                        </div>
                    </div>`}`}
                </main>
                <footer class="mt-12 py-8 bg-white border-t">
                    <div class="max-w-6xl mx-auto px-4 text-center">
                        <p class="font-bold text-orange-900 mb-4">${CONFIG.nombreLocal}</p>
                        <div class="flex justify-center gap-4 mb-4">
                            ${CONFIG.redesSociales.instagram?`<a href="${CONFIG.redesSociales.instagram}" target="_blank" class="w-10 h-10 bg-gradient-to-br from-purple-600 to-pink-500 text-white rounded-full flex items-center justify-center">📷</a>`:''}
                            ${CONFIG.redesSociales.facebook?`<a href="${CONFIG.redesSociales.facebook}" target="_blank" class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center">f</a>`:''}
                        </div>
                        <div class="text-sm text-gray-600">
                            <p class="font-bold mb-2">Horarios:</p>
                            ${Object.entries(CONFIG.horarios).map(([d,i])=>`<p class="text-xs"><span class="capitalize font-medium">${d}</span>: ${i.horarios}</p>`).join('')}
                        </div>
                    </div>
                </footer>
            </div>`;
        }
        render();
    </script>
</body>
</html>
